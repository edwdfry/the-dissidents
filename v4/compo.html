<!-- Fonts -->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link

<body>

<!-- ==========================================================
     ZONE PROTÉGÉE
=========================================================== -->

<div id="passwordOverlay" class="music-lock">


<div class="music-lock-content">

    <h3>
        Espace réservé
    </h3>

    <p>
        Veuillez saisir le mot de passe ci-dessous.
    </p>

    <div class="password-form">

        <input
            type="password"
            id="passwordInput"
            placeholder="Mot de passe"
            autocomplete="off"
        >

        <button
            type="button"
            class="music-password-button"
            onclick="checkPassword()"
        >
            OK
        </button>

    </div>

    <p
        id="passwordError"
        class="music-error"
        aria-live="polite"
    ></p>

</div>


</div>

<!-- ==========================================================
     HEADER
=========================================================== -->

<header class="header">


<a
    class="brand"
    href="#accueil"
    aria-label="Retour à l'accueil"
>
    <img
        src="assets/images/logo-detoure.png"
        alt="The Dissidents"
    >
</a>


<nav
    class="main-nav"
    aria-label="Navigation principale"
>

    <a href="index.html">
        ACCUEIL
    </a>

    </a>

    <a href="membres.html">

    <a href="#evenements">

    </a>

    <a class="active" href="compo.html">
        COMPO
    </a>

    <a href="#contact">
        CONTACT
    </a>

</nav>


<button
    class="menu-toggle"
    type="button"
    aria-label="Ouvrir le menu"
    aria-expanded="false"
>
    <span></span>
    <span></span>
</button>


</header>
