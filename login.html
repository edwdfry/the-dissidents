```
<main class="login-page">

    <div class="login-box">

       <!--
        <img 
            src="images/logo.jpg" 
            alt="Logo The Dissidents"
            class="login-logo"
        >
        -->

        <h1>Accès membres</h1>

        <p>Cette page est réservée aux membres du groupe.</p>

        <form id="loginForm">

            <label for="password">
                Mot de passe
            </label>

            <input 
                type="password"
                id="password"
                placeholder="Entrez le mot de passe"
                required
            >

            <button type="submit">
                Accéder à la musique
            </button>

            <p id="errorMessage"></p>

        </form>

        <a href="index.html">
            Retour à l'accueil
        </a>

    </div>

</main>

<script>

    const motDePasse = "EGTT";

    const loginForm = document.getElementById("loginForm");
    const passwordInput = document.getElementById("password");
    const errorMessage = document.getElementById("errorMessage");

    loginForm.addEventListener("submit", function(event) {

        event.preventDefault();

        if (passwordInput.value === motDePasse) {

            window.location.href = "musique.html";

        } else {

            errorMessage.textContent = "Mot de passe incorrect.";
            passwordInput.value = "";
            passwordInput.focus();

        }

    });

</script>
```

</body>
