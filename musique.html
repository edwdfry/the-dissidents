<script>

const AUDIO_WORKER ="https://the-dissidents-audio.ed-ferry.workers.dev";


async function hashPassword(password) {

    const data = new TextEncoder().encode(password);

    const hashBuffer =
        await crypto.subtle.digest(
            "SHA-256",
            data
        );

    const hashArray =
        Array.from(
            new Uint8Array(hashBuffer)
        );

    return hashArray
        .map(
            byte =>
                byte
                    .toString(16)
                    .padStart(2, "0")
        )
        .join("");

}


async function checkPassword() {

    const input =
        document.getElementById(
            "passwordInput"
        );

    const password =
        input.value;


    if (!password) {
        return;
    }


    try {

        // =========================
        // DEMANDE DE TOKEN AU WORKER
        // =========================

        const response =
            await fetch(
                `${AUDIO_WORKER}/login`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        password: password
                    })
                }
            );


        if (!response.ok) {

            throw new Error(
                "Mot de passe incorrect"
            );

        }


        const data =
            await response.json();


        const token =
            data.token;


        // =========================
        // CACHE LA FENÊTRE
        // =========================

        document
            .getElementById(
                "passwordOverlay"
            )
            .style.display = "none";


        // =========================
        // CONFIGURE LES LECTEURS
        // =========================

        document
            .querySelectorAll(
                "audio[data-file]"
            )
            .forEach(
                audio => {

                    const filename =
                        audio.dataset.file;


                    const streamUrl =
                        `${AUDIO_WORKER}/stream/` +
                        encodeURIComponent(
                            filename
                        ) +
                        `?token=` +
                        encodeURIComponent(
                            token
                        );


                    audio.src =
                        streamUrl;

                }
            );


    } catch (error) {

        document
            .getElementById(
                "passwordError"
            )
            .textContent =
                "Mot de passe incorrect.";


        input.value = "";

    }

}

</script>
